/* ============================================================
   WebGL 交互式流体扭曲背景（value-noise fbm + 鼠标涟漪）
   ============================================================ */
(function(){
  // —— 着色器源码 ——
  const VERT_SRC =
   'attribute vec2 a_pos;\n'+
   'varying vec2 v_uv;\n'+
   'void main(){\n'+
   '  v_uv = a_pos * 0.5 + 0.5;\n'+
   '  gl_Position = vec4(a_pos, 0.0, 1.0);\n'+
   '}\n';
  // value noise + warped-domain fbm，鼠标点贡献高斯位移扰动
  const FRAG_SRC =
   '#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n'+
   'varying vec2 v_uv;\n'+
   'uniform vec2  u_res;\n'+
   'uniform float u_time;\n'+
   'uniform vec2  u_mouse;      // 归一化 (0..1) 屏幕坐标，鼠标\n'+
   'uniform vec2  u_mousePrev;  // 上一帧鼠标，用于求拖尾方向\n'+
   'uniform vec2  u_trail1;\n'+
   'uniform vec2  u_trail2;\n'+
   'uniform vec2  u_trail3;\n'+
   'uniform float u_trailA[3];  // 每个轨迹点的强度衰减系数\n'+
   'uniform vec3  u_bgA;\n'+
   'uniform vec3  u_bgB;\n'+
   'uniform vec3  u_tint;\n'+
   'uniform vec3  u_accent;\n'+
   'uniform vec3  u_mouseCol;\n'+
   'uniform float u_intensity;  // 全局扭曲强度\n'+
   '\n'+
   // 基于 hash 的 value noise（稳定、短、兼容 WebGL1）
   'float hash(vec2 p){ p = fract(p*vec2(234.34, 435.345)); p += dot(p, p+34.234); return fract(p.x*p.y); }\n'+
   'float vnoise(vec2 p){\n'+
   '  vec2 i=floor(p), f=fract(p);\n'+
   '  float a=hash(i), b=hash(i+vec2(1.,0.));\n'+
   '  float c=hash(i+vec2(0.,1.)), d=hash(i+vec2(1.,1.));\n'+
   '  vec2 u=f*f*(3.0-2.0*f);\n'+
   '  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);\n'+
   '}\n'+
   'float fbm(vec2 p){\n'+
   '  float v=0.0, a=0.5;\n'+
   '  for(int i=0;i<5;i++){ v += a*vnoise(p); p*=2.02; a*=0.5; }\n'+
   '  return v;\n'+
   '}\n'+
   // 单个鼠标/轨迹点的位移贡献
   'vec2 mouseDisplace(vec2 uv, vec2 m, float strength){\n'+
   '  vec2 d = uv - m;\n'+
   '  float aspect = u_res.x / u_res.y;\n'+
   '  d.x *= aspect;\n'+
   '  float dist2 = dot(d,d);\n'+
   '  // 高斯衰减：近处强，远处 0；半径约 25% 屏幕\n'+
   '  float bump = exp(-dist2 * 28.0) * strength;\n'+
   '  // 扰动方向：径向（向外推，水被排开）\n'+
   '  return normalize(d + 1e-5) * bump * 0.08;\n'+
   '}\n'+
   'void main(){\n'+
   '  vec2 uv = v_uv;\n'+
   '  float t = u_time * 0.12;\n'+
   // 1) 鼠标/轨迹的位移扰动（跟随鼠标 = 水波涟漪）
   '  vec2 disp = vec2(0.0);\n'+
   '  disp += mouseDisplace(uv, u_mouse,     1.0);\n'+
   '  disp += mouseDisplace(uv, u_trail1,    u_trailA[0]);\n'+
   '  disp += mouseDisplace(uv, u_trail2,    u_trailA[1]);\n'+
   '  disp += mouseDisplace(uv, u_trail3,    u_trailA[2]);\n'+
   // 2) 拖尾速度方向的额外条纹（流动痕迹）
   '  vec2 mv = u_mouse - u_mousePrev;\n'+
   '  float spd = clamp(length(mv)*30., 0., 1.);\n'+
   '  disp += mv * 1.5 * exp(-distance(uv,u_mouse)*8.0) * spd;\n'+
   '  disp *= u_intensity;\n'+
   // 3) 基础域扭曲 fbm（天然流体起伏）
   '  vec2 p = uv + disp;\n'+
   '  vec2 q = vec2( fbm(p + vec2(0.0,    t       )),\n'+
   '                 fbm(p + vec2(5.2, - 1.3 - t*0.7)) );\n'+
   '  vec2 r = vec2( fbm(p + 1.6*q + vec2(1.7,9.2) + 0.35*t),\n'+
   '                 fbm(p + 1.6*q + vec2(8.3,2.8) - 0.25*t) );\n'+
   '  float f = fbm( p + 1.8*r );\n'+
   // 4) 额外的细尺度高频扰动增加扭曲感（扭曲再扭曲）
   '  float f2 = fbm( p*4.0 + r*3.0 + t );\n'+
   '  f = mix(f, f2, 0.22);\n'+
   // 5) 三阶段配色：bgA→bgB→tint→accent，并叠加鼠标色
   '  vec3 col = mix(u_bgA, u_bgB, smoothstep(0.0, 0.55, f));\n'+
   '  col = mix(col, u_tint, smoothstep(0.42, 0.72, f) * 0.55);\n'+
   '  col = mix(col, u_accent, smoothstep(0.68, 0.95, f) * 0.35);\n'+
   // 6) 鼠标点发光叠加（"鼠标划过水面"的辉光聚焦）
   '  float mg = exp(-distance(uv, u_mouse) * 7.0);\n'+
   '  col += u_mouseCol * mg * 0.12 * u_intensity;\n'+
   // 7) 轻微 vignette，聚焦中央
   '  vec2 vg = uv - 0.5;\n'+
   '  col *= 1.0 - dot(vg,vg)*0.35;\n'+
   '  gl_FragColor = vec4(col, 1.0);\n'+
   '}\n';

  const FL = {
    canvas:null, gl:null, prog:null, aPos:-1,
    uniforms:{},
    mouse:{tx:0.5, ty:0.5, x:0.5, y:0.5, px:0.5, py:0.5}, // tx/ty 目标值（像素），x/y 已 lerp 后（归一）
    trail:[{x:0.5,y:0.5,a:0},{x:0.5,y:0.5,a:0},{x:0.5,y:0.5,a:0}],
    intensity:1.0,
    running:false,
    dpr:1,
    w:0, h:0
  };

  // 工具：hex → rgb(0..1)，或 rgb(...) 字符串解析
  function cssToRgb(css){
    css = (css||'').trim();
    if(!css) return [0.5,0.5,0.5];
    const tmp = document.createElement('div');
    tmp.style.color = css;
    document.body.appendChild(tmp);
    const s = getComputedStyle(tmp).color;
    document.body.removeChild(tmp);
    // s = "rgb(r, g, b)" or "rgba(r,g,b,a)"
    const m = s.match(/rgba?\(([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/);
    if(m) return [Number(m[1])/255, Number(m[2])/255, Number(m[3])/255];
    return [0.5,0.5,0.5];
  }
  function readCssColors(){
    const cs = getComputedStyle(document.documentElement);
    const g = k => cssToRgb(cs.getPropertyValue(k));
    Object.assign(FL, {
      bgA: g('--fl-bg-a'),
      bgB: g('--fl-bg-b'),
      tint: g('--fl-tint'),
      accent: g('--fl-accent'),
      mouseCol: g('--fl-mouse')
    });
    // 若已初始化 program，立刻写回 uniforms
    if(FL.prog && FL.gl){ writeColorUniforms(); }
  }
  function writeColorUniforms(){
    const g = FL.gl, u=FL.uniforms;
    g.uniform3fv(u.bgA,    FL.bgA);
    g.uniform3fv(u.bgB,    FL.bgB);
    g.uniform3fv(u.tint,   FL.tint);
    g.uniform3fv(u.accent, FL.accent);
    g.uniform3fv(u.mouseCol, FL.mouseCol);
  }

  function compile(type, src){
    const g=FL.gl, s=g.createShader(type);
    g.shaderSource(s, src); g.compileShader(s);
    if(!g.getShaderParameter(s, g.COMPILE_STATUS)){
      console.error('shader compile:', g.getShaderInfoLog(s));
      g.deleteShader(s); return null;
    }
    return s;
  }

  function initGL(){
    FL.canvas = document.getElementById('fluid-canvas');
    if(!FL.canvas) return false;
    let gl = null;
    try { gl = FL.canvas.getContext('webgl', {antialias:false, alpha:false, premultipliedAlpha:false, preserveDrawingBuffer:false}); }
    catch(_){}
    if(!gl){ try { gl = FL.canvas.getContext('experimental-webgl'); } catch(_){} }
    if(!gl){
      // 降级：隐藏 canvas，保留 body 原有 CSS 渐变背景兜底
      FL.canvas.style.display='none';
      console.warn('[fluid] WebGL not supported, fallback to CSS background.');
      return false;
    }
    FL.gl = gl;
    const vs = compile(gl.VERTEX_SHADER, VERT_SRC);
    const fs = compile(gl.FRAGMENT_SHADER, FRAG_SRC);
    if(!vs||!fs) return fail();
    const p = gl.createProgram();
    gl.attachShader(p,vs); gl.attachShader(p,fs); gl.linkProgram(p);
    if(!gl.getProgramParameter(p, gl.LINK_STATUS)){ console.error('program link:', gl.getProgramInfoLog(p)); return fail(); }
    FL.prog = p;
    FL.aPos = gl.getAttribLocation(p, 'a_pos');  // 按经验 767382：不硬编码 0
    const u = FL.uniforms;
    u.res       = gl.getUniformLocation(p,'u_res');
    u.time      = gl.getUniformLocation(p,'u_time');
    u.mouse     = gl.getUniformLocation(p,'u_mouse');
    u.mousePrev = gl.getUniformLocation(p,'u_mousePrev');
    u.trail1    = gl.getUniformLocation(p,'u_trail1');
    u.trail2    = gl.getUniformLocation(p,'u_trail2');
    u.trail3    = gl.getUniformLocation(p,'u_trail3');
    u.trailA    = gl.getUniformLocation(p,'u_trailA');
    u.bgA       = gl.getUniformLocation(p,'u_bgA');
    u.bgB       = gl.getUniformLocation(p,'u_bgB');
    u.tint      = gl.getUniformLocation(p,'u_tint');
    u.accent    = gl.getUniformLocation(p,'u_accent');
    u.mouseCol  = gl.getUniformLocation(p,'u_mouseCol');
    u.intensity = gl.getUniformLocation(p,'u_intensity');
    // 全屏 quad (VBO)
    const vb = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1,-1,  3,-1,  -1, 3   // 覆盖全屏的三角形
    ]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(FL.aPos);
    gl.vertexAttribPointer(FL.aPos, 2, gl.FLOAT, false, 0, 0);
    gl.useProgram(p);
    readCssColors();
    resize();
    return true;
  }
  function fail(){ if(FL.canvas) FL.canvas.style.display='none'; FL.gl=null; return false; }

  // 按视口宽计算移动端优化策略（DPR 上限 + 扭曲强度降低，避免过热与眩晕感）
  function deviceTier(){
    const w = Math.max(window.innerWidth, window.innerHeight);
    if(w <= 480) return {dprMax:1.25, intensity:0.72};       // 小屏手机
    if(w <= 768) return {dprMax:1.5,  intensity:0.86};       // 中屏手机/平板小
    return {dprMax:1.75, intensity:1.0};                     // 平板/桌面
  }

  function resize(){
    if(!FL.gl) return;
    const g=FL.gl, tier = deviceTier();
    const dpr = Math.min(window.devicePixelRatio||1, tier.dprMax);
    FL.dpr = dpr;
    FL.intensity = tier.intensity;
    const w = Math.floor(window.innerWidth * dpr);
    const h = Math.floor(window.innerHeight * dpr);
    if(FL.w===w && FL.h===h) return;
    FL.w=w; FL.h=h;
    FL.canvas.width=w; FL.canvas.height=h;
    FL.canvas.style.width='100vw';
    // 先写 100vh 回退，再写 100dvh 覆盖（认识 dvh 的浏览器取后者）
    FL.canvas.style.height = '100vh';
    try{ FL.canvas.style.height = '100dvh'; }catch(_){}
    // 若实际渲染高度异常，回退精确 px
    const test = FL.canvas.getBoundingClientRect();
    if(test.height < 50) FL.canvas.style.height = window.innerHeight + 'px';
    g.viewport(0,0,w,h);
    g.uniform2f(FL.uniforms.res, w, h);
  }

  function onPointerMove(e){
    // touch / mouse 统一
    let cx, cy;
    if(e.touches && e.touches[0]){ cx=e.touches[0].clientX; cy=e.touches[0].clientY; }
    else { cx=e.clientX; cy=e.clientY; }
    if(cx==null) return;
    // 归一化（保留 aspect 差异在 shader 内修正）
    FL.mouse.tx = cx / window.innerWidth;
    FL.mouse.ty = 1.0 - (cy / window.innerHeight);  // 翻转 y，gl 坐标下 y=1 在顶
    // 立即在 shader 中形成涟漪，不等待 lerp 完
    updateTrailInstant();
  }
  function updateTrailInstant(){
    // 把当前鼠标坐标压入 trail 队列
    const t = FL.trail;
    t[2].x = t[1].x; t[2].y = t[1].y; t[2].a = t[1].a * 0.6;
    t[1].x = t[0].x; t[1].y = t[0].y; t[1].a = t[0].a * 0.65;
    t[0].x = FL.mouse.tx; t[0].y = FL.mouse.ty; t[0].a = 0.95;
  }
  function initEvents(){
    window.addEventListener('mousemove', onPointerMove, {passive:true});
    window.addEventListener('touchmove', onPointerMove, {passive:true});
    window.addEventListener('pointerdown', onPointerMove, {passive:true});
    window.addEventListener('resize', resize);
    // 深浅色切换时，重新读取颜色
    // 监听属性变化（toggleTheme 设置 data-theme）
    const mo = new MutationObserver(()=>{ readCssColors(); });
    mo.observe(document.documentElement, {attributes:true, attributeFilter:['data-theme','style']});
  }

  function loop(ts){
    if(!FL.gl) return;
    requestAnimationFrame(loop);
    const g = FL.gl, u = FL.uniforms;
    // 鼠标 lerp（按经验 1549200：目标值 + RAF 内低系数追随）
    const L = FL.mouse;
    L.px = L.x; L.py = L.y;
    L.x += (L.tx - L.x) * 0.18;
    L.y += (L.ty - L.y) * 0.18;
    // trail 随时间衰减
    FL.trail.forEach(p=>{ p.a *= 0.982; });
    // uniforms
    g.uniform1f(u.time, ts*0.001);
    g.uniform2f(u.mouse, L.x, L.y);
    g.uniform2f(u.mousePrev, L.px, L.py);
    g.uniform2f(u.trail1, FL.trail[0].x, FL.trail[0].y);
    g.uniform2f(u.trail2, FL.trail[1].x, FL.trail[1].y);
    g.uniform2f(u.trail3, FL.trail[2].x, FL.trail[2].y);
    g.uniform1fv(u.trailA, [FL.trail[0].a, FL.trail[1].a, FL.trail[2].a]);
    g.uniform1f(u.intensity, FL.intensity);
    // draw
    g.drawArrays(g.TRIANGLES, 0, 3);
  }

  window.initFluidGL = function(){
    if(FL.running) return;
    try{
      if(!initGL()) return;  // 失败已自行降级
      initEvents();
      FL.running = true;
      requestAnimationFrame(loop);
    }catch(e){
      console.error('[fluid] init error:', e);
      if(FL.canvas) FL.canvas.style.display='none';
    }
  };
  window.updateFluidColors = readCssColors; // 暴露给 toggleTheme 用
})();

/* ============================================================
   图片 / PDF 画廊：模态层
   功能：放大查看 / 左右切换 / 关闭 / ESC 快捷键 / 触摸滑动 /
        点击遮罩关闭 / 缩略图底栏 / PDF iframe 内嵌+降级
   ============================================================ */
(function Gallery(){
  const state = {
    items: [],   // [{type:'image'|'pdf', src, caption}]
    idx: 0,
    scale: 1,
    opened: false
  };

  function ensureDom(){
    if(document.getElementById("galleryModal")) return;
    const z = langState.cur==='zh';
    const html = `
  <div class="gallery-modal" id="galleryModal" role="dialog" aria-modal="true" aria-labelledby="galleryCaption">
    <div class="gallery-inner">
      <button class="gallery-close" id="gClose" aria-label="${z?'关闭':'Close'}" data-label="${z?'关闭':'Close'}">${svgIco('closeX')}</button>
      <div class="gallery-header">
        <span class="gallery-caption" id="galleryCaption">&nbsp;</span>
        <span class="gallery-counter" id="galleryCounter">0 / 0</span>
      </div>
      <div class="gallery-stage" id="galleryStage">
        <button class="gallery-nav prev" id="gPrev" aria-label="${z?'上一张':'Previous'}">${svgIco('arrowL')}</button>
        <button class="gallery-nav next" id="gNext" aria-label="${z?'下一张':'Next'}">${svgIco('arrowR')}</button>
      </div>
      <div class="gallery-toolbar" id="gToolbar"></div>
      <div class="gallery-thumbs" id="gThumbs"></div>
    </div>
  </div>`;
    document.body.insertAdjacentHTML('beforeend', html);
    // 事件
    $("#gClose").addEventListener("click", closeGallery);
    $("#gPrev").addEventListener("click", e=>{ e.stopPropagation(); step(-1); });
    $("#gNext").addEventListener("click", e=>{ e.stopPropagation(); step(1); });
    $("#galleryModal").addEventListener("click", onBgClick);
    // 阻止 stage 内部冒泡触发遮罩关闭
    $("#galleryStage").addEventListener("click", e=>e.stopPropagation());
    $("#gToolbar").addEventListener("click", e=>e.stopPropagation());
    $("#gThumbs").addEventListener("click", e=>e.stopPropagation());
    // 键盘
    document.addEventListener("keydown", onKey);
    // 触摸滑动（stage 层左右滑切换，缩放图片时禁用）
    setupTouch();
    // 图片点击放大
    $("#galleryStage").addEventListener("click", onStageInnerClick, true);
  }

  function onBgClick(e){
    // 点击 modal 背景 = 关闭（内层已 stopPropagation）
    if(e.target && e.target.id && e.target.id === "galleryModal") closeGallery();
  }

  function onStageInnerClick(e){
    const img = e.target.closest(".gallery-img");
    if(!img) return;
    e.stopPropagation();
    if(state.scale > 1) resetZoom();
    else if(state.items[state.idx].type === "image") zoomIn();
  }

  function onKey(e){
    if(!state.opened) return;
    if(e.key === "Escape"){ closeGallery(); e.preventDefault(); return; }
    if(e.key === "ArrowLeft"){ step(-1); e.preventDefault(); return; }
    if(e.key === "ArrowRight"){ step(1); e.preventDefault(); return; }
    if(e.key === "+" || e.key === "="){ if(state.items[state.idx]?.type==='image') zoomIn(); e.preventDefault(); return; }
    if(e.key === "-" || e.key === "_"){ if(state.items[state.idx]?.type==='image') zoomOut(); e.preventDefault(); return; }
    if(e.key === "0"){ if(state.items[state.idx]?.type==='image') resetZoom(); e.preventDefault(); return; }
  }

  // 触摸：stage 区域；非缩放态时左右滑切换项
  let _tsx = 0, _tsy = 0, _tMoved = false;
  function setupTouch(){
    const stage = $("#galleryStage");
    stage.addEventListener("touchstart", e=>{
      if(state.scale !== 1) return;
      const t = e.touches[0]; if(!t) return;
      _tsx = t.clientX; _tsy = t.clientY; _tMoved = false;
    }, {passive:true});
    stage.addEventListener("touchmove", e=>{
      if(state.scale !== 1) return;
      const t = e.touches[0]; if(!t) return;
      const dx = t.clientX - _tsx, dy = t.clientY - _tsy;
      if(Math.abs(dx) > 32 && Math.abs(dx) > Math.abs(dy)) _tMoved = true;
    }, {passive:true});
    stage.addEventListener("touchend", e=>{
      if(state.scale !== 1) return;
      if(!_tMoved) return;
      const t = e.changedTouches[0]; if(!t) return;
      const dx = t.clientX - _tsx;
      if(dx < -32) step(1);
      else if(dx > 32) step(-1);
      _tMoved = false;
    }, {passive:true});
  }

  function openGallery(items, startIdx=0){
    ensureDom();
    if(!items || !items.length) return;
    state.items = items;
    state.idx = Math.max(0, Math.min(startIdx|0, items.length-1));
    state.scale = 1;
    state.opened = true;
    document.body.style.overflow = "hidden";
    const m = $("#galleryModal");
    m.classList.add("open");
    // 先建缩略图 / 工具栏（无需依赖具体 item）
    renderThumbs();
    renderToolbar();
    renderCurrent();
    // 同步关闭按钮 aria-label + 文案
    const zText = langState.cur==='zh';
    $("#gClose").setAttribute("aria-label", zText?'关闭':'Close');
    $("#gClose").setAttribute("data-label", zText?'关闭':'Close');
    $("#gPrev").setAttribute("aria-label", zText?'上一张':'Previous');
    $("#gNext").setAttribute("aria-label", zText?'下一张':'Next');
  }

  function closeGallery(){
    if(!state.opened) return;
    state.opened = false;
    state.scale = 1;
    document.body.style.overflow = "";
    const m = $("#galleryModal");
    if(m) m.classList.remove("open");
    // 清理 stage 内部，避免 iframe/PDF 继续播放
    const s = $("#galleryStage");
    if(s){
      const keep = ["gPrev","gNext"].map(id=>document.getElementById(id)).filter(Boolean);
      [...s.children].forEach(c=>{ if(keep.indexOf(c)===-1) c.remove(); });
    }
  }

  function step(delta){
    if(!state.items.length) return;
    const n = state.items.length;
    state.idx = (((state.idx + delta) % n) + n) % n;
    state.scale = 1;
    renderCurrent();
    renderThumbs();
  }

  function zoomIn(){
    const item = state.items[state.idx]; if(!item || item.type!=='image') return;
    state.scale = Math.min(state.scale + 0.4, 3.2);
    applyScale();
  }
  function zoomOut(){
    const item = state.items[state.idx]; if(!item || item.type!=='image') return;
    state.scale = Math.max(state.scale - 0.3, 1);
    applyScale();
  }
  function resetZoom(){ state.scale = 1; applyScale(); }
  function applyScale(){
    const img = $("#galleryStage").querySelector(".gallery-img");
    if(!img) return;
    img.style.setProperty("--scale", state.scale);
    img.classList.toggle("zoomed", state.scale > 1);
  }

  function renderCurrent(){
    const stage = $("#galleryStage");
    // 保留 prev/next 按钮
    const prev = $("#gPrev"), next = $("#gNext");
    stage.innerHTML = "";
    stage.appendChild(prev);
    stage.appendChild(next);
    const item = state.items[state.idx];
    // 按钮禁用态
    prev.disabled = state.items.length <= 1;
    next.disabled = state.items.length <= 1;

    if(item.type === "image"){
      const img = document.createElement("img");
      img.className = "gallery-img";
      img.alt = pick(item.caption) || "";
      img.loading = "eager";
      img.decoding = "async";
      img.addEventListener("load", ()=>{ /* noop */ });
      img.addEventListener("error", ()=>{
        img.style.opacity=".2";
      });
      img.src = item.src;
      img.style.setProperty("--scale", "1");
      stage.appendChild(img);
    } else if(item.type === "pdf"){
      // iOS Safari 内嵌 PDF 可能不显示；降级为下载链接
      const ua = navigator.userAgent || "";
      const isiOS = /iPhone|iPad|iPod/i.test(ua);
      if(isiOS){
        const box = document.createElement("div");
        box.className = "gallery-pdf-fallback";
        box.innerHTML = `<div style="font-size:15px;font-weight:600">${langState.cur==='zh'?'当前浏览器不支持内嵌预览 PDF':'Inline PDF preview is not supported on this device'}</div>
          <a href="${esc(item.src)}" target="_blank" rel="noopener">${svgIco('external')}<span>${langState.cur==='zh'?'在新窗口打开 PDF':'Open PDF in new tab'}</span></a>`;
        stage.appendChild(box);
      } else {
        const iframe = document.createElement("iframe");
        iframe.className = "gallery-pdf";
        iframe.src = item.src + "#toolbar=1&view=FitH";
        iframe.title = pick(item.caption) || "PDF";
        iframe.loading = "eager";
        stage.appendChild(iframe);
      }
    }

    // 顶部标题 & 计数器
    $("#galleryCaption").textContent = pick(item.caption) || "";
    $("#galleryCounter").textContent = `${state.idx + 1} / ${state.items.length}`;

    // 工具栏按钮显隐：缩放仅 image 类
    renderToolbar(item.type);
  }

  function renderToolbar(type){
    const t = $("#gToolbar");
    type = type || (state.items[state.idx] && state.items[state.idx].type);
    const z = langState.cur==='zh';
    let imageTools = "";
    if(type === "image"){
      imageTools = `
        <button class="gallery-btn" id="gZoomOut" title="${z?'缩小':'Zoom out'}" aria-label="${z?'缩小':'Zoom out'}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg>
        </button>
        <button class="gallery-btn wide" id="gReset" title="${z?'重置大小':'Reset zoom'}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V7a2 2 0 0 1 2-2h5M21 12V5a2 2 0 0 0-2-2h-5M3 12v5a2 2 0 0 0 2 2h5M21 12v7a2 2 0 0 1-2 2h-5"/></svg>
          <span>${z?'重置':'Reset'}</span>
        </button>
        <button class="gallery-btn" id="gZoomIn" title="${z?'放大':'Zoom in'}" aria-label="${z?'放大':'Zoom in'}">${svgIco('zoomIn')}</button>
        <button class="gallery-btn wide" id="gDownload" title="${z?'下载原图':'Download original'}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          <span>${z?'下载原图':'Download'}</span>
        </button>`;
    }
    let pdfTools = "";
    if(type === "pdf"){
      pdfTools = `
        <button class="gallery-btn wide" id="gOpenPdf">
          ${svgIco('external')}
          <span>${z?'在新窗口打开 PDF':'Open PDF in new tab'}</span>
        </button>`;
    }
    t.innerHTML = `
      <button class="gallery-btn" id="gPrev2" title="${z?'上一张':'Previous'}" aria-label="${z?'上一张':'Previous'}">${svgIco('arrowL')}</button>
      ${imageTools}
      ${pdfTools}
      <button class="gallery-btn" id="gNext2" title="${z?'下一张':'Next'}" aria-label="${z?'下一张':'Next'}">${svgIco('arrowR')}</button>`;
    const eid = (id,fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener("click", e=>{ e.stopPropagation(); fn(); }); };
    eid("gPrev2", ()=>step(-1));
    eid("gNext2", ()=>step(1));
    if(type === "image"){
      eid("gZoomIn", zoomIn);
      eid("gZoomOut", zoomOut);
      eid("gReset", resetZoom);
      eid("gDownload", ()=>{
        const it = state.items[state.idx]; if(!it) return;
        const a = document.createElement("a"); a.href = it.src; a.download = (pick(it.caption)||"image").replace(/[^\w\u4e00-\u9fa5-. ]+/g,"_") + getExt(it.src);
        a.rel = "noopener"; a.target = "_blank"; document.body.appendChild(a); a.click(); a.remove();
      });
    }
    if(type === "pdf"){
      eid("gOpenPdf", ()=>{
        const it = state.items[state.idx]; if(!it) return;
        window.open(it.src, "_blank", "noopener");
      });
    }
  }
  function getExt(src){
    const m = (src||"").match(/\.([a-zA-Z0-9]+)(?:[\?#]|$)/);
    return m ? ("."+m[1]) : "";
  }

  function renderThumbs(){
    const t = $("#gThumbs");
    t.innerHTML = state.items.map((it,i)=>{
      const active = i === state.idx ? "active" : "";
      if(it.type === "pdf"){
        return `<div class="gallery-thumb pdf ${active}" data-thumb="${i}" title="${esc(pick(it.caption)||'PDF')}">${svgIco('cert')}</div>`;
      }
      return `<div class="gallery-thumb ${active}" data-thumb="${i}" title="${esc(pick(it.caption)||'Image')}" style="background-image:url('${esc(it.src)}')"></div>`;
    }).join("");
    t.onclick = e=>{
      const el = e.target.closest("[data-thumb]"); if(!el) return;
      const i = Number(el.dataset.thumb);
      if(i === state.idx) return;
      state.idx = i; state.scale = 1;
      renderCurrent(); renderThumbs();
    };
  }

  // 暴露
  window.openGallery = openGallery;
  window.closeGallery = closeGallery;

  /* 绑定卡片点击触发：点击 data-gallery-trigger 所在卡，打开 gallery */
  function bindCardTriggers(){
    ensureDom();
    document.addEventListener("click", function triggerGallery(e){
      // 点外链按钮或其它明确阻止的元素，不开画廊
      if(e.target.closest("[data-stop-gallery]")) return;
      const media = e.target.closest("[data-gallery-trigger]");
      if(!media) return;
      const card = media.closest("[data-gallery]");
      if(!card) return;
      const raw = card.getAttribute("data-gallery");
      if(!raw) return;
      try{
        const items = JSON.parse(raw.replace(/&quot;/g,'"'));
        if(!items || !items.length) return;
        openGallery(items, 0);
      }catch(err){ console.warn("gallery parse:", err); }
    });
    // 键盘：回车键/空格键 对媒体区开画廊
    document.addEventListener("keydown", e=>{
      if(e.key!=="Enter" && e.key!==" ") return;
      const ae = document.activeElement;
      if(!ae || !ae.matches("[data-gallery-trigger]")) return;
      const card = ae.closest("[data-gallery]"); if(!card) return;
      const raw = card.getAttribute("data-gallery"); if(!raw) return;
      try{
        const items = JSON.parse(raw.replace(/&quot;/g,'"'));
        if(!items || !items.length) return;
        openGallery(items, 0); e.preventDefault();
      }catch(_){}
    });
  }

  // 在 renderAll 后已绑定事件之前挂好
  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", bindCardTriggers);
  } else {
    bindCardTriggers();
  }
})();

/* ============================================================
   启动
   ============================================================ */
(function init(){
  // 主题持久化
  try{
    const saved=localStorage.getItem("resume-theme");
    if(saved) document.documentElement.setAttribute("data-theme",saved);
    else if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)
      document.documentElement.setAttribute("data-theme","dark");
  }catch(e){}
  if(document.documentElement.getAttribute("data-theme")==="dark"){
    const ico=$("#themeIcon");
    if(ico) ico.innerHTML='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>';
  }
  renderAll();
  // 启动 LLX 视差层（滚动视差 + 鼠标微移）
  setupLlxParallax();
  // 启动 WebGL 流体扭曲背景（失败自动降级，不阻塞）
  if(typeof window.initFluidGL==='function') window.initFluidGL();
})();
</script>
</body>
</html>
