<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
<meta name="format-detection" content="telephone=no,email=no,address=no" />
<meta name="theme-color" content="#f7f6f1" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />
<title>林露茜 · Lin Luqian</title>
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#f7f4ea;
  --bg-soft:#efe9d9;
  --card:#ffffff;
  --card-2:#fbf7ec;
  --ink:#1d1a14;
  --ink-soft:#4d473a;
  --ink-mute:#7d7563;
  --line:#e5ddc7;
  --accent:#1f3a8a;
  --accent-2:#c2664a;
  --accent-3:#2d7a6e;
  --accent-soft:#e8e1ff;
  --accent-soft-2:#fbe6db;
  --shadow:0 28px 70px -30px rgba(30,26,18,.35);
  --shadow-2:0 10px 28px -14px rgba(30,26,18,.25);
  --shadow-soft:0 2px 10px rgba(30,26,18,.05);
  --radius:18px;
  --radius-lg:24px;
  /* 全局层级体系 */
  --z-bg:0;
  --z-content:1;
  --z-fab:70;
  --z-header:80;
  --z-toast:100;
  --serif:"Noto Serif SC","Iowan Old Style","Palatino Linotype","Georgia","Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
  --display:"Noto Serif SC","Songti SC","PingFang SC","Georgia",serif;
  /* LLX 中间字母填充色 */
  --llx-mid:#0f1117;
  /* WebGL 流体层 */
  --fl-bg-a:#eef2f4;
  --fl-bg-b:#faf5e6;
  --fl-tint:#2f58b4;
  --fl-accent:#c2664a;
  --fl-mouse:#2d7a6e;
}
[data-theme="dark"]{
  --bg:#0e0c14;
  --bg-soft:#16131e;
  --card:#1a1725;
  --card-2:#231e32;
  --ink:#efeade;
  --ink-soft:#c2baa8;
  --ink-mute:#888270;
  --line:#2a2538;
  --accent:#9bb2ff;
  --accent-2:#ffb39b;
  --accent-3:#76d6c6;
  --accent-soft:#202046;
  --accent-soft-2:#3a2320;
  --shadow:0 28px 70px -20px rgba(0,0,0,.7);
  --shadow-2:0 10px 28px -14px rgba(0,0,0,.55);
  --shadow-soft:0 2px 10px rgba(0,0,0,.2);
  --llx-mid:#f7f4ea;
  --fl-bg-a:#141120;
  --fl-bg-b:#0a0814;
  --fl-tint:#9bb2ff;
  --fl-accent:#ffb39b;
  --fl-mouse:#76d6c6;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
/* 流式字号：桌面 16px → 手机 14px；保证正文 ≥14px（用户硬性指标） */
html{font-size:clamp(14px, 0.85vw + 12px, 16px)}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  color:var(--ink);
  /* 页面底色完全透明：底层视觉由 WebGL 流体画布承担；html 保留 var(--bg) 作为关闭 WebGL 时的兜底 */
  background:transparent;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  /* 排版引擎优化：启用连字、字距微调、比例数字 */
  text-rendering:optimizeLegibility;
  font-feature-settings:"kern" 1,"liga" 1,"calt" 1;
  font-optical-sizing:auto;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
  /* 移动端安全区：iPhone 刘海/底部 home indicator */
  padding-top:calc(env(safe-area-inset-top) * 0.6);
  padding-bottom:env(safe-area-inset-bottom);
  /* 避免 iPad Safari 双击缩放影响触控节奏：最小触控元素仍保留 44px */
  touch-action: manipulation;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* ============ WebGL 流体扭曲背景 ============ */
#fluid-canvas{
  position:fixed;inset:0;z-index:var(--z-bg);pointer-events:none;display:block;width:100vw;height:100vh;
}

/* ============ LLX 镂空视差字层（滚动视差 + 鼠标微移，位于卡片层之下） ============ */
.llx-bg{
  position:fixed;inset:0;z-index:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;user-select:none;
  font-family:var(--serif);font-weight:700;
  font-size:clamp(96px,24vw,380px);
  line-height:1;letter-spacing:.06em;
  will-change:transform;
}
/* 两侧字母：镂空描边，贴合网页风格 */
.llx-bg .llx-hollow{
  color:transparent;
  -webkit-text-stroke:2px color-mix(in srgb,var(--ink) 26%,transparent);
}
/* 中间 L：日版用夜版底色，夜版用日版底色 */
.llx-bg .llx-mid{
  color:var(--llx-mid);
  text-shadow:0 10px 46px color-mix(in srgb,var(--llx-mid) 30%,transparent);
}
/* 主内容叠在流体层上；卡片轻微玻璃拟态透出流体 */
main{position:relative;z-index:var(--z-content)}
.home-card, .c3d-card, .snap-item{
  backdrop-filter:blur(6px) saturate(1.05);
  -webkit-backdrop-filter:blur(6px) saturate(1.05);
}

/* ============ 顶部导航（艺术玻璃 + 微浮雕） ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:var(--z-header);
  display:flex;align-items:center;justify-content:space-between;
  padding:12px clamp(16px,4vw,48px);
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:blur(18px) saturate(1.18);
  -webkit-backdrop-filter:blur(18px) saturate(1.18);
  border-bottom:1px solid var(--line);
}
.topbar::after{
  content:"";position:absolute;inset:0 0 -1px 0;pointer-events:none;
  background:linear-gradient(90deg, transparent, color-mix(in srgb,var(--accent) 28%,transparent) 50%, transparent);
  height:1px;top:auto;opacity:.6;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.6px;font-family:var(--display)}
.brand-dot{width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #fff 0%, var(--accent) 35%, var(--accent-2) 100%);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent), 0 4px 14px -2px color-mix(in srgb,var(--accent-2) 55%,transparent);
  animation:dotFloat 3.6s ease-in-out infinite;
}
@keyframes dotFloat{ 0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)} }
.brand small{color:var(--ink-mute);font-weight:500;font-size:12px;letter-spacing:1.5px}
.brand strong{font-size:16px;background:linear-gradient(120deg,var(--ink) 10%,color-mix(in srgb,var(--accent) 70%,var(--ink)) 60%,color-mix(in srgb,var(--accent-2) 80%,var(--ink)) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}

.nav-tabs{display:flex;align-items:center;gap:2px;background:color-mix(in srgb,var(--bg-soft) 60%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow-soft) inset}
.nav-tab{
  appearance:none;border:0;background:transparent;color:var(--ink-soft);
  padding:8px 18px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;
  transition:all .28s cubic-bezier(.22,.61,.36,1);
  position:relative;
}
.nav-tab[aria-selected="true"]{
  background:linear-gradient(135deg,color-mix(in srgb,var(--card) 92%,transparent), color-mix(in srgb,var(--accent-soft) 70%,transparent));
  color:var(--ink);
  box-shadow:var(--shadow-2), 0 0 0 1px color-mix(in srgb,var(--accent) 10%,transparent) inset;
}
.nav-tab[aria-selected="true"]::after{
  content:"";position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
  width:20px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
}
.nav-tab:hover:not([aria-selected="true"]){color:var(--ink);transform:translateY(-1px)}
.nav-tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tools{display:flex;align-items:center;gap:8px}
.tool-btn{
  appearance:none;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 76%,transparent);
  backdrop-filter:blur(10px);color:var(--ink-soft);width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;transition:all .24s cubic-bezier(.22,.61,.36,1);
}
.tool-btn:hover{color:var(--ink);border-color:var(--accent);transform:translateY(-1px) rotate(-4deg);box-shadow:var(--shadow-soft)}
.tool-btn svg{width:18px;height:18px}

/* ============ 主区域 / 三页 ============ */
main{padding-top:64px}
.page{min-height:100vh;min-height:100dvh;padding:80px clamp(16px,5vw,80px);position:relative;scroll-margin-top:64px}
.page-head{max-width:1100px;margin:0 auto 48px;display:flex;flex-direction:column;gap:6px}
.page-eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:10px}
.page-eyebrow::before{content:"";width:26px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.page-title{font-family:var(--serif);font-size:clamp(32px,4.5vw,56px);font-weight:700;letter-spacing:-.5px;margin:0;line-height:1.12;text-wrap:balance;
  background:linear-gradient(120deg,var(--ink) 20%,color-mix(in srgb,var(--accent) 72%,var(--ink)) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.page-sub{color:var(--ink-mute);font-size:15px;max-width:60ch;text-wrap:pretty}

/* ============ 首页 ============ */
#home{
  display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(1200px 600px at 80% -10%, color-mix(in srgb,var(--accent) 10%,transparent), transparent 60%),
    radial-gradient(900px 500px at 0% 110%, color-mix(in srgb,var(--accent-3) 10%,transparent), transparent 60%);
}
.home-card{
  width:min(960px,100%);
  /* 玻璃拟态：半透明底 + blur，让首页流体扭曲透出卡片四周 */
  background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);border-radius:24px;
  box-shadow:var(--shadow);padding:48px;position:relative;overflow:hidden;
}
.home-card::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 6%,transparent),transparent 40%);pointer-events:none}
.home-grid{display:grid;grid-template-columns:160px 1fr;gap:36px;align-items:center}
.avatar{
  width:160px;height:160px;border-radius:22px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;color:#fff;font-family:var(--serif);font-size:54px;font-weight:700;
  box-shadow:0 12px 30px -10px color-mix(in srgb,var(--accent) 50%,transparent);
  position:relative;overflow:hidden;
}
.avatar svg{position:absolute;inset:0;width:100%;height:100%;opacity:.18}
.home-name{font-family:var(--serif);font-size:clamp(28px,4vw,42px);font-weight:700;letter-spacing:-.5px;margin:0 0 4px;text-wrap:balance;
  background:linear-gradient(120deg,var(--ink) 15%,color-mix(in srgb,var(--accent) 68%,var(--ink)) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.home-title{color:var(--accent);font-weight:600;letter-spacing:.3px;margin-bottom:14px}
.home-bio{color:var(--ink-soft);max-width:60ch;text-wrap:pretty}
.home-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{font-size:12px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--bg-soft) 55%,transparent);border:1px solid var(--line);color:var(--ink-soft);backdrop-filter:blur(6px)}
/* 教育背景块（首页）：学校 / 专业 / 学位 / 时间 */
.home-edu{
  display:flex;align-items:flex-start;gap:14px;
  margin-top:28px;padding:16px 18px;border-radius:14px;
  background:color-mix(in srgb,var(--bg-soft) 42%,transparent);
  border:1px solid var(--line);
}
.edu-ico{width:38px;height:38px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 45%,transparent)}
.edu-ico svg{width:20px;height:20px}
.edu-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.edu-line{font-size:15px;color:var(--ink);font-weight:600}
.edu-line b{font-weight:700}
.edu-sep{margin:0 8px;color:var(--ink-mute)}
.edu-sub{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink-mute)}
.edu-period{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
/* 技能 / 特长 / 爱好 标签组（首页） */
.home-groups{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.home-group{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.group-label{
  flex:0 0 auto;min-width:72px;text-align:justify;text-align-last:justify;
  font-size:12px;letter-spacing:1px;color:var(--ink-mute);font-weight:700;
}
.home-group .home-tags{margin-top:0}

.home-contacts{
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px;
  margin-top:36px;padding-top:28px;border-top:1px dashed var(--line);
}
.contact{display:flex;align-items:center;gap:12px}
.contact-ico{
  width:38px;height:38px;border-radius:10px;background:color-mix(in srgb,var(--bg-soft) 60%,transparent);
  display:grid;place-items:center;color:var(--accent);flex-shrink:0;
}
.contact-ico svg{width:18px;height:18px}
.contact-meta{display:flex;flex-direction:column;min-width:0}
.contact-label{font-size:11px;color:var(--ink-mute);letter-spacing:1px;text-transform:uppercase}
.contact-val{font-size:14px;color:var(--ink);font-weight:600;word-break:break-all;display:flex;align-items:center;gap:6px}
.copy-btn{
  appearance:none;border:0;background:transparent;color:var(--ink-mute);cursor:pointer;padding:2px;
  display:grid;place-items:center;border-radius:4px;
}
.copy-btn:hover{color:var(--accent)}
.copy-btn svg{width:13px;height:13px}

/* ============ 第二页 / 第三页：3D 环形轮播 ============ */
.carousel-wrap{
  max-width:1100px;margin:0 auto;position:relative;
}
.carousel{
  position:relative;width:100%;height:clamp(420px,60vh,560px);
  perspective:1500px;perspective-origin:50% 50%;
  /* scene 已移除：改为玻璃拟态底色，透出下方 LLX 视差字与流体背景 */
  background:color-mix(in srgb,var(--card) 42%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:24px;border:1px solid var(--line);
  box-shadow:var(--shadow);
  transition:transform .55s cubic-bezier(.3,.7,.4,1);
  overflow:hidden;
}
.carousel::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(800px 400px at 50% 0%,color-mix(in srgb,#fff 8%,transparent),transparent 60%);
}
[data-theme="dark"] .carousel::after{
  background:radial-gradient(800px 400px at 50% 0%,color-mix(in srgb,#fff 4%,transparent),transparent 60%);
}
.stage{
  /* 卡片与半透明轮播底完全贴合：尺寸 = 容器 100%（透视原点居中，无偏移） */
  position:absolute;width:100%;height:100%;
  left:50%;top:50%;transform-style:preserve-3d;
  transform:translate(-50%,-50%) rotateY(var(--rot,0deg));
  transition:transform .9s cubic-bezier(.22,.61,.36,1);
}
.c3d-card{
  position:absolute;inset:0;border-radius:20px;overflow:hidden;
  background:color-mix(in srgb,var(--card) 94%,transparent);border:1px solid var(--line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:var(--shadow);
  /* scale(--s)：激活卡经透视补偿后精确铺满展示区，非激活卡缩小退后形成叠层 */
  transform:rotateY(calc(var(--i) * var(--angle,90deg))) translateZ(var(--radius,420px)) scale(var(--s,1));
  backface-visibility:hidden;
  display:flex;flex-direction:column;
  /* 非激活卡快速淡出：规避旋转中途两卡平面相交产生的遮挡/穿模 */
  transition:opacity .35s ease,filter .6s ease,transform .85s cubic-bezier(.22,.61,.36,1);
}
.c3d-card .card-media{
  height:150px;flex-shrink:0;position:relative;overflow:hidden;
  /* 背景融合：柔和双色渐变 + 顶部径向光晕，让图标视觉融入卡片场景 */
  background:
    radial-gradient(120% 130% at 50% -10%, color-mix(in srgb,var(--accent-2) 40%,transparent), transparent 62%),
    linear-gradient(135deg,color-mix(in srgb,var(--accent) 42%,transparent),color-mix(in srgb,var(--accent-2) 34%,transparent));
  display:grid;place-items:center;color:#fff;
}
/* 底部淡出到卡片底色，形成图片→卡片内容区的自然过渡（背景图扩展融合） */
.c3d-card .card-media::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent 30%,color-mix(in srgb,var(--card) 55%,transparent) 100%);
}
.c3d-card .card-media svg{width:58px;height:58px;opacity:.9;filter:drop-shadow(0 6px 18px rgba(0,0,0,.25))}
.c3d-card .card-body{padding:24px 30px;flex:1;display:flex;flex-direction:column;gap:10px;overflow:auto}
.c3d-card .card-eyebrow{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);font-weight:700}
.c3d-card .card-title{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1.25;margin:0;text-wrap:balance}
.c3d-card .card-meta{font-size:13px;color:var(--ink-mute);display:flex;gap:10px;flex-wrap:wrap}
.c3d-card .card-desc{font-size:14px;color:var(--ink-soft);line-height:1.75;max-width:68ch;text-wrap:pretty}
.c3d-card .card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:12px}
.c3d-card .card-tags .tag{font-size:11px}

/* 当前激活卡片：透视补偿完全贴合展示区（1500/(1500-420)≈1.39 → scale .72 ≈ 1.0） */
.c3d-card.is-active{
  z-index:5;--s:.72;opacity:1;
  box-shadow:0 30px 70px -25px rgba(20,28,48,.5);
  /* 略延迟淡入：等旧卡基本淡出后再出现，避免交叠残影 */
  transition:opacity .45s ease .1s,transform .85s cubic-bezier(.22,.61,.36,1),filter .6s ease;
}
/* 非激活卡：淡出并缩小退后（旋转过程不可见，杜绝遮挡） */
.stage .c3d-card:not(.is-active){--s:.58;opacity:0;filter:brightness(.96) saturate(.85)}

/* 逐字错峰入场 */
.stagger span{display:inline-block;opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s cubic-bezier(.22,.61,.36,1)}
.stagger.in span{opacity:1;transform:none}
.c3d-card.is-active .stagger span{transition-delay:calc(var(--k,0) * 38ms + 120ms)}

.carousel-nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:7;
  width:44px;height:44px;border-radius:50%;border:0;
  background:transparent;
  color:var(--ink);cursor:pointer;display:grid;place-items:center;
  transition:color .25s ease,transform .25s ease;
}
.carousel-nav:hover{color:var(--accent);transform:translateY(-50%) scale(1.06)}
.carousel-nav svg{width:20px;height:20px}
.carousel-nav.prev{left:14px}
.carousel-nav.next{right:14px}

/* 滚动吸附（sub-snap）：辅助条 —— 横向收缩至刚好展示全部标签 */
.snap-rail{
  height:auto;overflow:visible;display:flex;gap:10px;
  padding:12px 4px 0;max-width:1100px;margin:24px auto 0;
}
.snap-item{
  flex:1 1 0;min-width:0;
  background:color-mix(in srgb,var(--card) 85%,transparent);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  cursor:pointer;transition:all .25s ease;
}
.snap-item[aria-current="true"]{border-color:var(--accent);box-shadow:var(--shadow-2);transform:translateY(-2px)}
.snap-item .si-eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snap-item .si-title{font-weight:700;font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snap-item .si-meta{font-size:12px;color:var(--ink-mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ 项目页 Tabs ============ */
.tabs{
  max-width:1100px;margin:0 auto 28px;display:flex;gap:6px;
  border-bottom:1px solid var(--line);padding:0 4px;
}
.tab{
  appearance:none;background:transparent;border:0;border-bottom:2px solid transparent;
  padding:10px 16px;font-size:14px;font-weight:600;color:var(--ink-mute);cursor:pointer;
  transition:all .25s ease;
}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.tab-panel{display:none}
.tab-panel[aria-hidden="false"]{display:block}

/* ============ 返回顶部 ============ */
.back-top{
  position:fixed;right:24px;bottom:24px;z-index:var(--z-fab);
  width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(8px);color:var(--ink);cursor:pointer;
  display:grid;place-items:center;box-shadow:var(--shadow-2);
  opacity:0;pointer-events:none;transform:translateY(12px);transition:all .3s ease;
}
.back-top.show{opacity:1;pointer-events:auto;transform:none}
.back-top:hover{color:var(--accent);border-color:var(--accent)}
.back-top svg{width:20px;height:20px}

/* ============ Toast ============ */
.toast{
  position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:var(--z-toast);
  opacity:0;pointer-events:none;transition:all .3s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ 触控尺寸基线（所有设备都适用，确保 ≥44×44px WCAG 2.1 2.5.5）============ */
.nav-tab{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 18px}
.tool-btn{min-width:44px;min-height:44px;width:44px;height:44px;padding:0}
.carousel-nav{min-width:44px;min-height:44px;width:44px;height:44px;padding:0}
.back-top{min-width:46px;min-height:46px}
.tab{min-height:44px;padding:10px 18px}
.snap-item{min-height:56px;padding:14px}
.copy-btn{min-width:36px;min-height:36px}
.page-title{
  font-size:clamp(28px, 4vw, 56px);
  line-height:1.15;
  letter-spacing:-.3px;
}
.home-name{
  font-size:clamp(24px, 3.5vw, 42px);
  line-height:1.2;
}

/* ============ 视觉美化：入场动画 / 选区 / 焦点态 ============ */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.page-head{animation:fadeUp .7s cubic-bezier(.22,.61,.36,1) both}
.home-card{animation:fadeUp .75s .06s cubic-bezier(.22,.61,.36,1) both}
.tabs{animation:fadeUp .7s .1s cubic-bezier(.22,.61,.36,1) both}
.carousel-wrap{animation:fadeUp .75s .12s cubic-bezier(.22,.61,.36,1) both}
.snap-rail{animation:fadeUp .7s .18s cubic-bezier(.22,.61,.36,1) both}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent);color:var(--ink)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
/* 主题切换平滑过渡：仅对无 transition 的元素追加颜色过渡，避免覆盖既有动画 */
.topbar,.home-card,.tag,.home-edu,.contact-ico{
  transition:color .4s ease,background-color .4s ease,border-color .4s ease,box-shadow .4s ease;
}
/* 衬线标题增强：启用连字与字距微调，旧体数字 */
.page-title,.home-name,.c3d-card .card-title,.avatar,.llx-bg{
  font-feature-settings:"kern" 1,"liga" 1,"onum" 1;
}

/* ============ 响应式：分 6 档精细断点（1024/768/560/480/420/360） ============ */
/* 1. 平板 / 大屏手机横屏（≤1024）：压缩 page padding / home card 内边距与宽度 */
@media (max-width:1024px){
  .page{padding:64px clamp(16px, 4vw, 56px)}
  .home-card{padding:36px clamp(20px, 4vw, 48px)}
  .carousel-wrap{max-width:900px}
}
/* 2. 平板小/大屏手机（≤768）：topbar 更紧凑，home-grid 切换单列，字号略微 */
@media (max-width:768px){
  .topbar{padding:12px clamp(12px, 3vw, 28px);gap:8px}
  .brand small{display:none}
  .nav-tabs{padding:3px;gap:2px}
  .nav-tab{padding:0 14px;font-size:14px}
  .page{padding:56px 20px 80px}
  .page-head{margin-bottom:28px}
  .page-sub{font-size:14px}
  .home-grid{grid-template-columns:1fr;justify-items:center;text-align:center;gap:24px}
  .home-tags{justify-content:center}
  .home-card{padding:32px 20px;border-radius:20px}
  .avatar{width:120px;height:120px;font-size:42px;border-radius:20px}
  .home-contacts{grid-template-columns:1fr 1fr;gap:12px}
  .contact{padding:6px 0}
  .carousel{height:520px;border-radius:20px}
  .c3d-card{border-radius:16px}
  .c3d-card .card-media{height:110px}
  .c3d-card .card-body{padding:18px}
  .c3d-card .card-title{font-size:19px}
}
/* 3. 普通手机（≤560）：topbar 导航 tab 与 tools 换行，2 列 contact，流体 canvas 降 DPR */
@media (max-width:560px){
  .topbar{flex-wrap:wrap;gap:8px;padding:10px 14px 12px}
  .brand{font-size:15px}
  .tools{order:2}
  .tool-btn{width:40px;height:40px;min-width:40px;min-height:40px}
  .nav-tabs{order:3;width:100%;justify-content:space-between;flex:1}
  .nav-tab{flex:1;padding:10px 8px;font-size:13px;min-height:42px;border-radius:10px}
  .back-top{width:42px;height:42px;right:16px;bottom:16px}
  .home-card{padding:24px 16px;border-radius:16px;box-shadow:none}
  .avatar{width:104px;height:104px;font-size:36px}
  .home-bio{font-size:14px;line-height:1.7}
  .home-contacts{grid-template-columns:1fr 1fr}
  .home-contacts .contact:last-child:nth-child(odd){grid-column:1/-1}
  .contact-ico{width:36px;height:36px;border-radius:9px}
  .contact-val{font-size:13px;line-height:1.4}
  .page-eyebrow{font-size:11px;letter-spacing:2.5px}
  .page-title{letter-spacing:-.2px}
  .tabs{gap:0;justify-content:space-between;margin-bottom:18px}
  .tab{padding:10px 10px;font-size:13px;min-height:40px}
  .carousel{height:500px;border-radius:18px}
  .carousel-nav.prev{left:8px}
  .carousel-nav.next{right:8px}
  .snap-rail{display:none}
}
/* 4. 中屏手机（≤480）：home contacts 改 1 列，轮播高度 480px */
@media (max-width:480px){
  .home-contacts{grid-template-columns:1fr;gap:10px}
  .carousel{height:480px}
  .carousel-nav{width:40px;height:40px;min-width:40px;min-height:40px}
  .carousel-nav svg{width:18px;height:18px}
}
/* 5. 小屏手机（≤420）：卡片高度再压缩，page-title 行高加 */
@media (max-width:420px){
  .page{padding:48px 14px 80px}
  .home-card{padding:20px 14px}
  .avatar{width:96px;height:96px;font-size:34px;border-radius:18px}
  .contact-meta .contact-label{font-size:10px}
  .tabs{padding:0;gap:0}
  .tab{padding:9px 8px;font-size:12.5px}
  .carousel{height:460px}
  .c3d-card .card-media{height:100px}
  .c3d-card .card-body{padding:16px}
  .c3d-card .card-title{font-size:18px}
  .c3d-card .card-desc{font-size:13.5px}
}
/* 6. 超小屏（≤360，例：iPhone SE 1st / 小屏安卓）：最后压缩底线，触控最小 40px */
@media (max-width:360px){
  .page{padding:42px 12px 72px}
  .page-title{font-size:26px;line-height:1.18}
  .home-name{font-size:22px}
  .home-card{padding:18px 12px;border-radius:14px}
  .avatar{width:84px;height:84px;font-size:30px;border-radius:16px}
  .home-bio{font-size:13.5px;line-height:1.72}
  .contact-ico{width:34px;height:34px;border-radius:8px}
  .contact-val{font-size:12.5px}
  .nav-tab{font-size:12.5px;padding:8px 6px;min-height:40px}
  .tool-btn{width:38px;height:38px;min-width:38px;min-height:38px}
  .tool-btn svg{width:17px;height:17px}
  .carousel{height:440px;border-radius:14px}
  .c3d-card .card-title{font-size:17px}
  .c3d-card .card-meta{font-size:12px}
  .c3d-card .card-desc{font-size:13px}
  .back-top{width:40px;height:40px}
}

/* ============ 横屏 / 折叠屏外屏（≤1024 且 矮屏）============ */
@media (orientation: landscape) and (max-height: 520px) {
  .topbar{padding:8px 16px;gap:8px}
  .nav-tab{min-height:38px}
  .tool-btn{width:38px;height:38px;min-width:38px;min-height:38px}
  .page{padding:56px 32px 72px}
  .home-card{padding:22px 28px;display:grid;grid-template-columns:1fr;gap:16px}
  .home-grid{grid-template-columns:120px 1fr;gap:20px}
  .avatar{width:96px;height:96px;font-size:34px}
  .home-contacts{grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
  .carousel{height:calc(100vh - 120px);min-height:340px}
  .snap-rail{display:none !important}
}
/* 横屏 + 超窄高度折叠屏（≤420 高） */
@media (orientation: landscape) and (max-height: 420px) {
  .carousel{min-height:280px}
  .c3d-card .card-media{height:72px}
}

/* ============ 减少动画偏好：移动端省电模式浏览器会触发 ============ */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .stage{transition:none}
  .stagger span{opacity:1 !important;transform:none !important;transition:none !important}
  .toast{transition:none}
  #fluid-canvas{display:none !important} /* 省电模式下关闭流体 WebGL */
}

/* ============ 桌面端精细交互反馈（有 hover 且 pointer:fine）============ */
@media (hover:hover) and (pointer:fine){
  .snap-item:hover{transform:translateY(-3px);box-shadow:var(--shadow-2)}
  .tag:hover{border-color:var(--accent);color:var(--accent)}
  .contact:hover .contact-ico{color:var(--accent-2);transform:translateY(-1px)}
  .contact-ico{transition:color .25s ease,transform .25s ease}
  .nav-tab:hover{color:var(--ink)}
  .c3d-card .card-media svg{transition:transform .5s cubic-bezier(.22,.61,.36,1)}
  .c3d-card.is-active .card-media svg{transform:scale(1.1)}
}

/* ============ 更清晰的触摸/点击反馈（移动端点击态）============ */
@media (hover: none) and (pointer: coarse) {
  .nav-tab, .tab, .tool-btn, .carousel-nav, .back-top, .copy-btn, .snap-item{
    -webkit-tap-highlight-color: transparent;
    transition: transform .08s ease, background-color .18s ease, box-shadow .18s ease;
  }
  .nav-tab:active, .tab:active{transform:scale(.96)}
  .tool-btn:active, .carousel-nav:active, .back-top:active, .copy-btn:active{transform:scale(.92)}
  .carousel-nav:active{transform:translateY(-50%) scale(.92)}
  .snap-item:active{transform:scale(.97)}
}

/* ============ 打印样式 ============ */
@media print{
  #fluid-canvas{display:none !important}
  .topbar,.back-top,.carousel-nav,.snap-rail,.tools,.copy-btn,.llx-bg{display:none !important}
  html,body{background:#fff !important;color:#000 !important}
  main{padding-top:0}
  .page{min-height:auto;padding:18px 0;page-break-inside:avoid}
  .page:first-of-type{page-break-after:always}
  .carousel{height:auto;background:#fff !important;border:0;overflow:visible}
  .stage{position:static;width:100%;height:auto;transform:none !important;display:block}
  .c3d-card{
    position:static;inset:auto;transform:none !important;
    box-shadow:none;border:1px solid #ccc;margin-bottom:14px;width:100%;height:auto;
    display:block;opacity:1 !important;filter:none !important;backface-visibility:visible;
  }
  .c3d-card .card-media{height:60px}
  .c3d-card .stagger span{opacity:1 !important;transform:none !important}
  .home-card,.c3d-card{box-shadow:none;border:1px solid #ccc}
  /* 修复渐变文字在打印时因 text-fill 透明而不可见的问题 */
  .page-title,.home-name{background:none !important;-webkit-background-clip:unset !important;background-clip:unset !important;-webkit-text-fill-color:#000 !important}
  .c3d-card,.home-card,.snap-item{background:#fff !important}
  .avatar{break-inside:avoid}
  .tabs{display:none}
  .tab-panel{display:block !important}
}

/* 减弱动画 */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  html{scroll-behavior:auto}
}

/* ============ 项目卡片媒体区增强：画廊触发角标 / 外链按钮 / 悬停点击 ============ */
.c3d-card .card-media{
  cursor:default;
  transition:filter .35s ease;
}
.c3d-card.has-gallery .card-media{ cursor:zoom-in; }
.c3d-card.is-active.has-gallery .card-media:hover{ filter:brightness(1.04) saturate(1.05); }
.c3d-card.is-active.has-gallery .card-media:active{ transform:scale(.992); }
.c3d-card .card-media:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
/* 画廊资源角标：左下角，半透明胶囊 + 放大图标 */
.card-media-badge{
  position:absolute; left:12px; bottom:12px; z-index:2;
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 10px; border-radius:999px;
  background:color-mix(in srgb,var(--card) 85%,transparent);
  border:1px solid var(--line);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  color:var(--ink); font-size:11.5px; font-weight:600; letter-spacing:.3px;
  box-shadow:var(--shadow-2);
  opacity:.95;
  transition:transform .25s ease, background-color .25s ease, color .25s ease;
  pointer-events:none;
}
.c3d-card.is-active.has-gallery:hover .card-media-badge{
  transform:translateY(-1px);
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  border-color:transparent;
}
/* 外链按钮：已从界面移除，保留选择器避免旧 DOM 引用，但默认隐藏 */
.card-link{ display:none !important; }

/* ============== 卡片媒体区：真实 <img> 渲染（除留白卡） ============== */
.c3d-card .card-media{
  overflow:hidden; position:relative;
  /* 去掉旧 SVG 伪类规则，用真实 img 保证比例 */
}
.c3d-card .card-media-img{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:center center;
  display:block;
  transition:transform .7s cubic-bezier(.22,.61,.36,1), filter .4s ease, opacity .4s ease;
  opacity:0;
  animation:imgFadeIn .55s ease .08s forwards;
  will-change:transform;
}
@keyframes imgFadeIn{ from{opacity:0; transform:scale(1.02)} to{opacity:1; transform:scale(1)} }
.c3d-card.is-active.has-gallery:hover .card-media-img,
.c3d-card.is-active.has-gallery:focus-within .card-media-img{
  transform:scale(1.06);
  filter:saturate(1.05);
}
.c3d-card .card-media-img.__err{ display:none; }
.c3d-card .card-media-fallback{
  position:absolute; inset:0;
  display:none; place-items:center;
  background:linear-gradient(135deg,
    color-mix(in srgb,var(--accent) 38%,transparent),
    color-mix(in srgb,var(--accent-2) 30%,transparent) 60%,
    color-mix(in srgb,var(--accent-3) 26%,transparent));
  color:#fff;
}
.c3d-card .card-media-fallback svg{ width:56px; height:56px; filter:drop-shadow(0 10px 22px rgba(0,0,0,.28)); }
.c3d-card:not(.is-plain-bg) .card-media-fallback[style*="display:grid"]{
  display:grid !important;
}

/* 图标：非留白卡中，图标作为 media-fallback 内部元素；有图时 fallback 隐藏 */
.c3d-card.has-gallery.is-active .card-media-fallback svg{
  width:44px;height:44px;opacity:.9;
}

/* 角标整体位置修正：徽章在左上角，避免遮挡人物主体 */
.card-media-badge{
  position:absolute; left:12px; top:12px; z-index:3;
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 10px; border-radius:999px;
  background:color-mix(in srgb,var(--card) 85%,transparent);
  border:1px solid var(--line);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  color:var(--ink); font-size:11.5px; font-weight:600; letter-spacing:.3px;
  box-shadow:var(--shadow-2);
  opacity:.96;
  transition:transform .25s ease, background-color .25s ease, color .25s ease, box-shadow .25s ease;
  pointer-events:none;
}
.card-media-badge svg{ width:14px;height:14px; }
.c3d-card.is-active.has-gallery:hover .card-media-badge{
  transform:translateY(-1px);
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff; border-color:transparent;
  box-shadow:0 14px 34px -10px color-mix(in srgb,var(--accent-2) 48%,transparent);
}

/* ============ 图片 / PDF 画廊模态层（统一风格 + 更易用） ============ */
.gallery-modal{
  position:fixed; inset:0; z-index:120;
  background:
    radial-gradient(1200px 800px at 20% 0%, color-mix(in srgb,var(--accent) 20%,transparent), transparent 60%),
    radial-gradient(1000px 800px at 100% 100%, color-mix(in srgb,var(--accent-2) 22%,transparent), transparent 55%),
    color-mix(in srgb,var(--ink) 82%,transparent);
  backdrop-filter:blur(22px) saturate(1.2);
  -webkit-backdrop-filter:blur(22px) saturate(1.2);
  display:none;
  align-items:center; justify-content:center;
  padding:clamp(10px,3vw,34px);
}
.gallery-modal.open{ display:flex; animation:galleryFadeIn .28s ease both; }
@keyframes galleryFadeIn{ from{opacity:0} to{opacity:1} }

.gallery-inner{
  position:relative; width:100%; height:100%; max-width:1420px; max-height:100%;
  display:grid;
  grid-template-rows:auto 1fr auto auto;
  gap:12px;
}

/* 顶部信息条：标题 + 计数器，玻璃胶囊 */
.gallery-header{
  color:#fff;
  padding:10px 64px 10px 16px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:color-mix(in srgb,#000 36%,transparent);
  border:1px solid color-mix(in srgb,#fff 12%,transparent);
  border-radius:999px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:0 16px 40px -20px rgba(0,0,0,.55);
  min-height:46px;
}
.gallery-caption{
  font-size:13.5px; font-weight:600; opacity:.96; line-height:1.4;
  max-width:min(80ch, 68%); text-wrap:pretty;
}
.gallery-counter{
  font-family:var(--mono); font-size:12px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase;
  opacity:.78; white-space:nowrap; font-variant-numeric:tabular-nums;
  padding:4px 10px; border-radius:999px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 80%,#000),color-mix(in srgb,var(--accent-2) 80%,#000));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,#fff 10%,transparent);
}

/* 关闭按钮：胶囊 + 文案提示更直观 */
.gallery-close{
  position:absolute; top:4px; right:4px; z-index:10;
  min-height:40px; height:40px; min-width:40px;
  padding:0 12px 0 10px;
  border-radius:999px;
  border:1px solid color-mix(in srgb,#fff 14%,transparent);
  background:color-mix(in srgb,#000 40%,transparent);
  color:#fff; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
  font-size:12px; font-weight:600; letter-spacing:.08em;
  transition:all .22s ease;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.gallery-close svg{ width:16px; height:16px; }
.gallery-close::after{ content: attr(data-label); }
.gallery-close:hover{
  color:#fff;
  background:linear-gradient(135deg,#e04b4b,#c24242);
  border-color:transparent;
  transform:translateY(-1px);
  box-shadow:0 16px 34px -10px rgba(224,75,75,.6);
}

/* 主展示区：图片或 PDF —— 圆角 + 内阴影 + 边框高光 */
.gallery-stage{
  flex:1; min-height:0; position:relative;
  display:flex; align-items:center; justify-content:center;
  border-radius:22px;
  padding:clamp(10px,2.2vw,26px);
  background:
    linear-gradient(180deg, color-mix(in srgb,#fff 6%,transparent) 0%, color-mix(in srgb,#000 20%,transparent) 100%),
    color-mix(in srgb,#000 28%,transparent);
  border:1px solid color-mix(in srgb,#fff 10%,transparent);
  overflow:hidden;
  box-shadow:
    0 50px 120px -30px rgba(0,0,0,.75),
    inset 0 1px 0 color-mix(in srgb,#fff 8%,transparent);
  isolation:isolate;
}
/* 图片：contain + 柔和阴影，保持比例，避免变形 */
.gallery-img{
  max-width:100%; max-height:100%;
  width:auto; height:auto;
  display:block;
  border-radius:16px;
  transition:transform .38s cubic-bezier(.22,.61,.36,1), box-shadow .3s ease, filter .3s ease;
  transform:scale(var(--scale,1));
  transform-origin:50% 50%;
  user-select:none;
  -webkit-user-drag:none;
  filter:drop-shadow(0 26px 50px rgba(0,0,0,.45));
  background:
    linear-gradient(45deg, #d7d4cc 25%, transparent 25%) 0 0/22px 22px,
    linear-gradient(-45deg, #d7d4cc 25%, transparent 25%) 0 11px/22px 22px,
    linear-gradient(45deg, transparent 75%, #d7d4cc 75%) 11px -11px/22px 22px,
    linear-gradient(-45deg, transparent 75%, #d7d4cc 75%) 11px 0/22px 22px;
  background-blend-mode:normal;
}
.gallery-img.zoomed{ cursor:zoom-out; box-shadow:0 24px 60px rgba(0,0,0,.6); }

/* PDF iframe：撑满展示区 */
.gallery-pdf{
  width:100%; height:100%; min-height:60vh;
  border:0; border-radius:16px; background:#fff;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.55);
}
/* PDF 降级提示（不支持 iframe 内嵌 PDF 时） */
.gallery-pdf-fallback{
  color:#fff; display:flex; flex-direction:column; gap:14px; align-items:center; text-align:center; padding:24px 26px;
  background:color-mix(in srgb,#000 30%,transparent); border:1px solid color-mix(in srgb,#fff 10%,transparent);
  border-radius:18px; max-width:480px;
}
.gallery-pdf-fallback a{
  display:inline-flex; align-items:center; gap:8px;
  padding:10px 18px; border-radius:999px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; font-weight:700;
  box-shadow:0 18px 34px -10px color-mix(in srgb,var(--accent-2) 55%,transparent);
}

/* 底部工具栏：更统一的胶囊风格 */
.gallery-toolbar{
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  flex-wrap:wrap;
  padding:8px 10px; margin:0 auto;
  background:color-mix(in srgb,#000 36%,transparent);
  border:1px solid color-mix(in srgb,#fff 10%,transparent);
  border-radius:999px;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:0 16px 40px -20px rgba(0,0,0,.6);
}
.gallery-btn{
  appearance:none;
  min-width:40px; min-height:40px; height:40px; width:40px;
  padding:0;
  border-radius:50%;
  border:1px solid color-mix(in srgb,#fff 10%,transparent);
  background:color-mix(in srgb,#fff 6%,transparent);
  color:#fff; cursor:pointer;
  display:inline-grid; place-items:center;
  transition:all .2s ease;
}
.gallery-btn svg{ width:18px; height:18px; }
.gallery-btn:hover{ background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 85%,#000),color-mix(in srgb,var(--accent-2) 85%,#000)); border-color:transparent; transform:translateY(-1px); box-shadow:0 14px 28px -10px color-mix(in srgb,var(--accent-2) 50%,transparent); }
.gallery-btn:active{ transform:scale(.94); }
.gallery-btn.wide{ width:auto; border-radius:999px; font-size:12.5px; font-weight:700; letter-spacing:.04em; gap:6px; padding:0 14px; }
.gallery-btn.wide svg{ width:15px; height:15px; }

/* 侧边左右切换按钮（大屏 & 多图时显示）—— 胶囊 + 玻璃 */
.gallery-nav{
  position:absolute; top:50%; transform:translateY(-50%);
  min-width:52px; min-height:52px; width:52px; height:52px;
  border-radius:50%;
  border:1px solid color-mix(in srgb,#fff 14%,transparent);
  background:color-mix(in srgb,#000 42%,transparent);
  color:#fff; cursor:pointer;
  display:grid; place-items:center; z-index:6;
  transition:all .22s ease;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  box-shadow:0 18px 40px -14px rgba(0,0,0,.55);
}
.gallery-nav svg{ width:22px; height:22px; }
.gallery-nav:hover{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); border-color:transparent; transform:translateY(-50%) scale(1.06); box-shadow:0 20px 42px -10px color-mix(in srgb,var(--accent-2) 55%,transparent); }
.gallery-nav.prev{ left:18px; }
.gallery-nav.next{ right:18px; }
.gallery-nav:disabled{ opacity:.22; cursor:not-allowed; transform:translateY(-50%) scale(1); background:color-mix(in srgb,#000 30%,transparent); box-shadow:none; }

/* 缩略图底栏：左右边距 + 玻璃 */
.gallery-thumbs{
  display:flex; gap:10px; justify-content:flex-start; align-items:center;
  padding:10px 12px; margin:0 auto; max-width:100%;
  overflow-x:auto; overflow-y:hidden;
  scrollbar-width:thin;
  background:color-mix(in srgb,#000 30%,transparent);
  border:1px solid color-mix(in srgb,#fff 8%,transparent);
  border-radius:18px;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.gallery-thumbs::-webkit-scrollbar{ height:6px; }
.gallery-thumbs::-webkit-scrollbar-thumb{ background:color-mix(in srgb,#fff 22%,transparent); border-radius:999px; }
.gallery-thumb{
  flex:0 0 auto;
  width:72px; height:54px;
  border-radius:10px;
  background-size:cover; background-position:center;
  border:2px solid transparent;
  cursor:pointer; opacity:.58;
  transition:all .22s ease;
  box-shadow:0 8px 20px -10px rgba(0,0,0,.6);
}
.gallery-thumb.pdf{
  display:grid; place-items:center;
  background:color-mix(in srgb,#fff 12%,transparent); color:#fff; font-size:11px; font-weight:600;
  border:1px solid color-mix(in srgb,#fff 14%,transparent);
}
.gallery-thumb.pdf svg{ width:22px; height:22px; }
.gallery-thumb:hover{ opacity:.95; transform:translateY(-1px); }
.gallery-thumb.active{
  border-color:var(--accent-2); opacity:1;
  box-shadow:0 12px 26px -6px color-mix(in srgb,var(--accent-2) 65%,transparent);
  transform:translateY(-2px) scale(1.04);
}

/* 响应式：手机 */
@media (max-width:768px){
  .gallery-modal{ padding:8px; }
  .gallery-header{
    padding:9px 46px 9px 14px; border-radius:18px;
    gap:8px; flex-wrap:wrap; min-height:0;
  }
  .gallery-caption{ font-size:13px; max-width:100%; line-height:1.45; }
  .gallery-close{
    top:2px; right:2px;
    padding:0 8px 0 6px; height:36px; min-height:36px; min-width:36px;
    font-size:11px;
  }
  .gallery-close svg{ width:16px; height:16px; }
  .gallery-stage{ padding:10px; border-radius:18px; }
  .gallery-nav{ width:42px; height:42px; min-width:42px; min-height:42px; }
  .gallery-nav svg{ width:18px; height:18px; }
  .gallery-nav.prev{ left:8px; }
  .gallery-nav.next{ right:8px; }
  .gallery-thumbs{ padding:8px; border-radius:14px; }
  .gallery-thumb{ width:56px; height:42px; border-radius:8px; }
  .gallery-btn{ width:38px; height:38px; min-width:38px; min-height:38px; }
  .gallery-btn svg{ width:16px; height:16px; }
  .gallery-btn.wide{ font-size:12px; padding:0 12px; }
}
@media (max-width:480px){
  .gallery-nav{ display:none; }
  .gallery-toolbar{ width:100%; overflow-x:auto; justify-content:flex-start; padding:8px; }
  .gallery-pdf{ min-height:55vh; }
  .gallery-counter{ padding:3px 8px; font-size:11px; }
}
/* 减少动画偏好 */
@media (prefers-reduced-motion:reduce){
  .gallery-modal.open{ animation:none; }
  .gallery-img, .gallery-thumb, .gallery-close, .gallery-nav, .gallery-btn{ transition:none !important; }
}

/* 打印样式补充：隐藏画廊 DOM */
@media print{ .gallery-modal, .card-media-badge, .card-link{ display:none !important; } }

/* 轮播左上/右上 prev/next：UI 已移除（彻底隐藏 & 禁用） */
.carousel-nav{ display:none !important; }

/* ============ 纯白卡（To be continue）=========== */
.c3d-card.is-plain-bg{ background:#fff; border-color:var(--line); }
.c3d-card.is-plain-bg .card-media{ color:var(--ink-mute); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
.c3d-card.is-plain-bg .card-media::after{ display:none; }
.plain-mark{ display:inline-flex; gap:10px; }
.plain-dot{
  width:10px;height:10px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 6px 16px -4px color-mix(in srgb,var(--accent) 60%,transparent);
  animation:dotFloat 2.6s ease-in-out infinite;
}
.plain-dot:nth-child(2){ animation-delay:.25s; background:linear-gradient(135deg,var(--accent-3),var(--accent)); }
.plain-dot:nth-child(3){ animation-delay:.5s; background:linear-gradient(135deg,var(--accent-2),var(--accent-3)); }
.plain-txt{
  font-family:var(--display); font-size:16px; letter-spacing:4px; color:var(--ink-mute);
  opacity:.75; text-transform:uppercase;
}
[data-theme="dark"] .c3d-card.is-plain-bg{ background:#ffffff; color:#1d1a14; }
[data-theme="dark"] .c3d-card.is-plain-bg .card-meta,
[data-theme="dark"] .c3d-card.is-plain-bg .card-desc{ color:#4d473a; }
[data-theme="dark"] .c3d-card.is-plain-bg .card-title{ color:#1d1a14; }
[data-theme="dark"] .c3d-card.is-plain-bg .card-body .tag{ color:#4d473a; }

/* ============ 第四页 · 未来（美术风格统一）=========== */
.page-future{
  min-height:100vh; min-height:100dvh;
  overflow:hidden;
  background:
    radial-gradient(900px 560px at 15% 10%, color-mix(in srgb,var(--accent) 12%,transparent), transparent 60%),
    radial-gradient(900px 560px at 95% 100%, color-mix(in srgb,var(--accent-2) 12%,transparent), transparent 60%),
    radial-gradient(700px 460px at 50% 60%, color-mix(in srgb,var(--accent-3) 10%,transparent), transparent 60%);
}
.future-inner{
  position:relative;
  max-width:1180px; margin:0 auto;
  min-height:calc(100vh - 160px); min-height:calc(100dvh - 160px);
  display:flex; flex-direction:column; justify-content:space-between;
  padding:0 clamp(4px, 1vw, 20px);
}
.future-head{ max-width:720px; position:relative; z-index:2; animation:fadeUp .8s .05s cubic-bezier(.22,.61,.36,1) both; }
.future-stage{
  position:absolute; inset:-10% -5% -5% -5%;
  pointer-events:none; z-index:1; overflow:hidden;
}
/* 三个柔光球：轻微呼吸 + 漂浮，色相呼应主题色 */
.orb{
  position:absolute; border-radius:50%;
  filter:blur(64px) saturate(1.1);
  opacity:.62; mix-blend-mode:multiply;
  will-change:transform;
  animation:orbFloat 14s ease-in-out infinite;
}
[data-theme="dark"] .orb{ mix-blend-mode:screen; opacity:.5; }
.orb-1{
  width:520px;height:520px; left:-120px; top:-140px;
  background:radial-gradient(circle at 30% 30%, color-mix(in srgb,var(--accent) 85%,#fff 15%), transparent 65%);
  animation-duration:15s;
}
.orb-2{
  width:460px;height:460px; right:-80px; top:10%;
  background:radial-gradient(circle at 65% 30%, color-mix(in srgb,var(--accent-2) 85%,#fff 15%), transparent 65%);
  animation-duration:18s; animation-delay:-3s;
}
.orb-3{
  width:560px;height:560px; left:35%; bottom:-220px;
  background:radial-gradient(circle at 60% 30%, color-mix(in srgb,var(--accent-3) 85%,#fff 15%), transparent 65%);
  animation-duration:21s; animation-delay:-6s;
}
@keyframes orbFloat{
  0%,100%{ transform:translate3d(0,0,0) scale(1); }
  33%{ transform:translate3d(30px,-22px,0) scale(1.04); }
  66%{ transform:translate3d(-22px,18px,0) scale(.98); }
}

/* 栅格纸背景：细密点阵 + 细线，整体通透不抢主视觉 */
.f-grid{
  position:absolute; inset:12%;
  background-image:
    linear-gradient(to right, color-mix(in srgb,var(--ink) 8%,transparent) 1px, transparent 1px),
    linear-gradient(to bottom, color-mix(in srgb,var(--ink) 8%,transparent) 1px, transparent 1px),
    radial-gradient(circle, color-mix(in srgb,var(--ink) 14%,transparent) 1px, transparent 1.4px);
  background-size: 56px 56px, 56px 56px, 14px 14px;
  mask-image: radial-gradient(ellipse at 50% 45%, #000 45%, transparent 85%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 45%, #000 45%, transparent 85%);
  opacity:.55;
  animation:gridDrift 24s linear infinite;
}
@keyframes gridDrift{
  from{ background-position: 0 0, 0 0, 0 0; }
  to  { background-position: 56px 56px, 56px 56px, 28px 28px; }
}
@media (prefers-reduced-motion:reduce){
  .orb, .f-grid{ animation:none !important; }
}

/* 中央引言：与顶部标题字体保持一致 */
.f-quote{
  position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%);
  max-width:min(720px, 80%);
  text-align:center;
  z-index:2;
}
.f-q-mark{
  display:block;
  font-family:var(--display); font-weight:700;
  font-size:clamp(48px, 8vw, 96px);
  line-height:.8;
  background:linear-gradient(120deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  opacity:.85;
  margin-bottom:10px;
  filter:drop-shadow(0 10px 26px color-mix(in srgb,var(--accent) 32%,transparent));
}
.f-q-line{
  display:inline-block;
  font-family:var(--serif);
  font-size:clamp(18px, 2.4vw, 28px);
  line-height:1.55; letter-spacing:-.2px; text-wrap:balance;
  color:var(--ink);
  opacity:.92;
}
.future-stage .stagger span{ transition-delay:calc(var(--k,0) * 42ms + 60ms); }

/* 右下角：未来 / just soon 的每一秒 */
.future-footer{
  position:relative; z-index:3;
  align-self:flex-end;
  text-align:right;
  padding:12px 6px 0;
  animation:fadeUp .8s .18s cubic-bezier(.22,.61,.36,1) both;
}
.f-main-line{
  font-family:var(--display); font-weight:700;
  font-size:clamp(44px, 8vw, 112px);
  line-height:1; letter-spacing:.08em;
  background:linear-gradient(120deg,
    var(--ink) 0%,
    color-mix(in srgb,var(--accent) 72%,var(--ink)) 55%,
    color-mix(in srgb,var(--accent-2) 82%,var(--ink)) 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 12px 40px color-mix(in srgb,var(--accent) 26%,transparent));
}
.f-sub-line{
  margin-top:10px;
  font-family:var(--sans);
  font-size:clamp(13px, 1.4vw, 17px);
  font-weight:600; letter-spacing:.12em;
  color:var(--ink-soft);
  text-transform:lowercase;
  display:inline-flex; align-items:center; gap:10px;
}
.f-sub-line::before{
  content:""; width:42px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  flex:0 0 auto;
  box-shadow:0 4px 14px -2px color-mix(in srgb,var(--accent-2) 50%,transparent);
}

/* 第四页响应式 */
@media (max-width:768px){
  .f-quote{ max-width:92%; top:46%; }
  .orb-1{ width:360px;height:360px; left:-140px; top:-160px; }
  .orb-2{ width:320px;height:320px; right:-100px; top:0%; }
  .orb-3{ width:420px;height:420px; left:20%; bottom:-240px; }
  .f-grid{ inset:8%; background-size: 44px 44px, 44px 44px, 12px 12px; }
  .f-sub-line::before{ width:26px; }
  .future-footer{ padding-top:40px; }
}
@media (max-width:480px){
  .page-future{ padding-left:14px; padding-right:14px; }
  .future-inner{ min-height:calc(100dvh - 120px); }
  .future-head{ padding-left:6px; }
  .f-sub-line{ letter-spacing:.08em; }
  .f-sub-line::before{ width:20px; }
}

/* ============ 小细节升级：玻璃更润 / 轮播边框高光 / 滚动条 / 涟漪 ============ */
/* 卡片标题后段微渐变，更富层次 */
.c3d-card .card-title{
  background:linear-gradient(120deg,var(--ink) 30%,color-mix(in srgb,var(--accent) 62%,var(--ink)) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
/* 轮播容器边缘高光 */
.carousel::before{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(135deg, color-mix(in srgb,#fff 36%,transparent) 0%, transparent 35%, transparent 65%, color-mix(in srgb,var(--accent-2) 18%,transparent) 100%);
  mix-blend-mode:overlay; opacity:.55;
}
/* 自定义滚动条（桌面 webkit） */
@supports selector(::-webkit-scrollbar){
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 40%,transparent),color-mix(in srgb,var(--accent-2) 40%,transparent));
    border-radius:999px; border:2px solid transparent; background-clip:content-box;
  }
  ::-webkit-scrollbar-thumb:hover{
    background:linear-gradient(180deg,var(--accent),var(--accent-2));
    background-clip:content-box;
  }
}
.c3d-card .card-body{ scrollbar-width:thin; scrollbar-color:color-mix(in srgb,var(--accent) 45%,transparent) transparent; }
</style>

<script>
/* ============================================================

const resume = {

    initials:"L",
    bio:{
      zh:"大一新生，以 AI Agent 为帆探索编程的浩瀚。",

/* ============================================================
   工具函数
   ============================================================ */
const $ = (s,root=document)=>root.querySelector(s);
const $$ = (s,root=document)=>Array.from(root.querySelectorAll(s));
const langState = { cur:"zh" };
const pick = (v)=> (v && typeof v==="object") ? (v[langState.cur] ?? v.zh ?? "") : (v ?? "");
const esc = (s)=> String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1800);
}

/* 把文本拆为逐字 span，用于错峰入场 */
function splitChars(el, text){
  el.classList.add("stagger");
  el.innerHTML="";
  const chars = Array.from(text);
  chars.forEach((ch,i)=>{
    const span=document.createElement("span");
    span.style.setProperty("--k",i);
    span.textContent = ch===" " ? "\u00A0" : ch;
    el.appendChild(span);
  });
}

   ============================================================ */
function renderHome(){
  const p=resume.profile;
  const emailParts = p.contacts.emailParts || [];
  const [eu,ed,et]=emailParts;
  const hasEmail=!!(eu&&ed&&et);   // 三部分非空即展示（占位符 ["user","example","com"] 也展示）
  const phone=p.contacts.phone;
  const addr=p.contacts.address;
  const gh=p.contacts.github;
  const wx=p.contacts.wechat;
  const web=p.contacts.website;
  // 仅在字段 truly 空（空串/undefined/null）时隐藏；带 [] 的占位符正常展示，方便后续查找替换
  const hasPhone = phone !== undefined && phone !== null && String(phone).trim() !== "";
  const hasAddr  = addr  !== undefined && addr  !== null && (addr.zh !== undefined ? (String(addr.zh).trim()!==""||(addr.en!==undefined&&String(addr.en).trim()!=="")) : (String(addr).trim()!==""));
  const hasGh    = gh    !== undefined && gh    !== null && String(gh).trim()    !== "";
  const hasWx    = wx    !== undefined && wx    !== null && String(wx).trim()    !== "";
  const hasWeb   = web   !== undefined && web   !== null && String(web).trim()   !== "";

  const contacts=[];
  if(hasEmail){
    const [u,d,t]=resume.profile.contacts.emailParts;
    // DOM 中只存拆分后的部分（防爬虫），显示为 user [at] example [dot] com
    contacts.push({
      ico:"mail", label:{zh:"邮箱",en:"Email"},
      display:`${u} [at] ${d} [dot] ${t}`,
      action:"copy", parts:{u,d,t}
    });
  }
  if(hasPhone) contacts.push({ico:"phone",label:{zh:"电话",en:"Phone"},val:pick(phone)});
  if(hasWx)    contacts.push({ico:"wechat",label:{zh:"微信",en:"WeChat"},val:String(wx),action:"copyStr",copyVal:String(wx)});
  if(hasGh)    contacts.push({ico:"github",label:{zh:"GitHub",en:"GitHub"},val:String(gh),href:`https://github.com/${String(gh).replace(/^@/,"")}`});
  if(hasWeb)   contacts.push({ico:"globe",label:{zh:"个人网页",en:"Website"},val:String(web),href:String(web).startsWith("http")?String(web):`https://${String(web)}`});
  if(hasAddr)  contacts.push({ico:"pin",label:{zh:"地址",en:"Address"},val:pick(addr)});

  const contactsHtml = contacts.map(c=>{
    const display = c.display ?? esc(c.val);
    const copyBtn = c.action==="copy"
      ? `<button class="copy-btn" data-eu="${esc(c.parts.u)}" data-ed="${esc(c.parts.d)}" data-et="${esc(c.parts.t)}" aria-label="复制邮箱" title="复制">${svgIco("copy")}</button>`
      : (c.action==="copyStr"
        ? `<button class="copy-btn" data-copy-str="${esc(c.copyVal)}" aria-label="${c.ico==='wechat'?(langState.cur==='zh'?'复制微信号':'Copy WeChat'):(langState.cur==='zh'?'复制':'Copy')}" title="${langState.cur==='zh'?'复制':'Copy'}">${svgIco("copy")}</button>`
        : "");
    const link = c.href ? `data-href="${esc(c.href)}"` : "";
    const valHtml = c.href
      ? `<a href="${esc(c.href)}" target="_blank" rel="noopener">${esc(c.val)}</a>`
      : display;
    return `
    <div class="contact" ${link}>
      <div class="contact-ico">${svgIco(c.ico)}</div>
      <div class="contact-meta">
        <span class="contact-label">${pick(c.label)}</span>
        <span class="contact-val">${valHtml}${copyBtn}</span>
      </div>
    </div>`;
  }).join("");

  // —— 教育背景（含学校/专业等基本信息） ——
  const edu = resume.education;
  const eduHtml = edu ? `
      <div class="home-edu">
        <span class="edu-ico">${svgIco("cap")}</span>
        <div class="edu-main">
          <div class="edu-line"><b>${esc(pick(edu.school))}</b><span class="edu-sep">·</span>${esc(pick(edu.major))}<span class="edu-sep">·</span>${esc(pick(edu.degree))}</div>
          <div class="edu-sub"><span class="edu-period">${esc(pick(edu.period))}</span><span class="edu-desc">${esc(pick(edu.desc))}</span></div>
        </div>
      </div>` : "";

  // —— 技能 / 特长 / 爱好 标签组 ——
  const zh = langState.cur==="zh";
  const groups = [
    { key:"skills",    label: zh?"专业技能":"Skills" },
    { key:"strengths", label: zh?"个人特长":"Strengths" },
    { key:"hobbies",   label: zh?"兴趣爱好":"Hobbies" }
  ];
  const groupsHtml = groups.map(g=>{
    const arr = pick(resume[g.key]) || [];
    if(!Array.isArray(arr) || !arr.length) return "";
    return `
      <div class="home-group">
        <span class="group-label">${esc(g.label)}</span>
        <div class="home-tags">${arr.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
      </div>`;
  }).join("");

  return `
  <section id="home" class="page" role="tabpanel" aria-labelledby="tab-home">
    <div class="home-card">
      <div class="home-grid">
        <div class="avatar" aria-hidden="true">
          ${svgIco("star")}
          <span>${esc(p.initials||"R")}</span>
        </div>
        <div>
          <h1 class="home-name" data-i18n="name">${esc(pick(p.name))}</h1>
          <div class="home-title" data-i18n="title">${esc(pick(p.title))}</div>
          <p class="home-bio" data-i18n="bio">${esc(pick(p.bio))}</p>
          <div class="home-tags">
            ${(pick(p.tags)?pick(p.tags):[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}
          </div>
        </div>
      </div>
      ${eduHtml}
      ${groupsHtml?`<div class="home-groups">${groupsHtml}</div>`:""}
      ${contacts.length?`<div class="home-contacts">${contactsHtml}</div>`:""}
    </div>
  </section>`;
}

/* ============================================================
   3D 环形轮播逻辑（支持 key: proj / cert）
   ============================================================ */
const carouselState={ proj:{i:0,n:0}, cert:{i:0,n:0} };

function initCarousel(key){
  const stage = $("#"+key+"Stage");
  if(!stage) return;
  const cards = $$(".c3d-card",stage);
  if(!carouselState[key]) carouselState[key]={i:0,n:0};
  carouselState[key].n = cards.length;
  carouselState[key].i = 0;
  const angle = cards.length>1 ? (360/cards.length) : 0;
  stage.style.setProperty("--angle", angle+"deg");
  stage.style.setProperty("--radius","420px");
  rotateStage(key,0,true);
}

function rotateStage(key,idx,silent){
  const st=carouselState[key];
  if(!st||!st.n) return;
  st.i = ((idx%st.n)+st.n)%st.n;
  const stage=$("#"+key+"Stage");
  const carousel=$("#"+key+"Carousel");
  if(!stage||!carousel) return;
  const angle = -(360/st.n)*st.i;
  stage.style.setProperty("--rot", angle+"deg");
  $$(".c3d-card",stage).forEach((c,i)=>{
    c.classList.toggle("is-active", i===st.i);
    c.style.zIndex = (i===st.i)?5:1;
  });
  $$(`[data-rail="${key}"]`).forEach(r=>{
    r.setAttribute("aria-current", String(Number(r.dataset.idx)===st.i));
  });
  applyStaggerOnActive(key, st.i);
}

function applyStaggerOnActive(key,idx){
  const stage=$("#"+key+"Stage");
  if(!stage) return;
  const card=$$(".c3d-card",stage)[idx];
  if(!card) return;
  $$(".stagger",stage).forEach(el=>el.classList.remove("in"));
  requestAnimationFrame(()=>{
    $$(".stagger",card).forEach(el=>{
      splitChars(el, el.textContent.trim());
      requestAnimationFrame(()=>el.classList.add("in"));
    });
  });
}

function triggerFutureStagger(){
  const stage=$("#future"); if(!stage) return;
  const sels=stage.querySelectorAll(".stagger");
  sels.forEach(el=>{
    splitChars(el, el.textContent.trim());
    requestAnimationFrame(()=>el.classList.add("in"));
  });
}

function nextCard(key,dir){ rotateStage(key, carouselState[key].i+dir); }

/* ============================================================
   事件绑定（顶部 4 Tabs + 两轮播 + 复制 + 返回顶部 + 主题/语言 + IO）
   ============================================================ */
function bindNavTabs(){
  const tabs=$$(".nav-tab");
  tabs.forEach((t,i,arr)=>{
    t.onclick = ()=>{
      const el=document.getElementById(t.dataset.target);
      if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
    };
    t.onkeydown = (e)=>{
      if(e.key!=="ArrowLeft" && e.key!=="ArrowRight") return;
      let ni = e.key==="ArrowRight" ? (i+1)%arr.length : (i-1+arr.length)%arr.length;
      arr[ni].focus(); arr[ni].click();
      e.preventDefault();
    };
  });
}
function bindEvents(){
  bindNavTabs();

  // —— 轮播 prev/next 按钮：已从 UI 移除，不再绑定
  // —— rail
  $$("[data-rail]").forEach(r=>r.addEventListener("click",()=>rotateStage(r.dataset.rail, Number(r.dataset.idx))));

  // —— 邮箱 / 微信等文本复制
  document.addEventListener("click",e=>{
    const b=e.target.closest("[data-eu], [data-copy-str]");
    if(!b) return;
    let val, okMsg;
    if(b.hasAttribute("data-eu")){
      val = `${b.dataset.eu}@${b.dataset.ed}.${b.dataset.et}`;
      okMsg = langState.cur==="zh"?"已复制邮箱":"Email copied";
    } else {
      val = b.getAttribute("data-copy-str");
      okMsg = langState.cur==="zh"?"已复制":"Copied";
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(val).then(
        ()=>toast(okMsg),
        ()=>toast(langState.cur==="zh"?"复制失败":"Copy failed")
      );
    } else {
      const ta=document.createElement("textarea");
      ta.value=val; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); toast(okMsg); }
      catch(_){ toast(langState.cur==="zh"?"复制失败":"Copy failed"); }
      ta.remove();
    }
  });

  // —— 返回顶部
  const bt=$("#backTop");
  window.addEventListener("scroll",()=>{
    if(window.scrollY>400) bt.classList.add("show");
    else bt.classList.remove("show");
    syncNavOnScroll();
  });
  bt.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));

  // —— 打印
  $("#printBtn").addEventListener("click",()=>window.print());

  // —— 主题切换
  $("#themeBtn").addEventListener("click",toggleTheme);

  // —— 语言切换
  $("#langBtn").addEventListener("click",()=>{ langState.cur = langState.cur==="zh"?"en":"zh"; applyLang(langState.cur); });

  // —— 轮播区滚轮 + 触摸（项目 & 证书）
  ["projCarousel","certCarousel"].forEach(id=>{
    const el=$("#"+id); if(!el) return;
    const key = id==="projCarousel"?"proj":"cert";
    let lock=false;
    el.addEventListener("wheel",e=>{
      const r=el.getBoundingClientRect();
      const inView = r.top<window.innerHeight*0.7 && r.bottom>window.innerHeight*0.3;
      if(!inView) return;
      if(Math.abs(e.deltaY)<Math.abs(e.deltaX)*0.4 && Math.abs(e.deltaX)<8) return;
      e.preventDefault();
      if(lock) return; lock=true;
      const dir = e.deltaY>0 || e.deltaX>0 ? 1 : -1;
      nextCard(key,dir);
      setTimeout(()=>lock=false, 700);
    }, {passive:false});

    let sx=0, sy=0;
    el.addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
    el.addEventListener("touchend",e=>{
      const dx=e.changedTouches[0].clientX-sx;
      const dy=e.changedTouches[0].clientY-sy;
      if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)){
        nextCard(key, dx<0?1:-1);
      }
    },{passive:true});
  });

  // —— 键盘左右：若在轮播可视，驱动当前轮播
  window.addEventListener("keydown",e=>{
    if(e.key!=="ArrowLeft" && e.key!=="ArrowRight") return;
    const ae=document.activeElement;
    if(ae && ae.classList && ae.classList.contains("nav-tab")) return;
    const proj=$("#projCarousel"), cert=$("#certCarousel");
    const key = inViewport(proj)?"proj" : (inViewport(cert)?"cert": null);
    if(!key) return;
    nextCard(key, e.key==="ArrowRight"?1:-1);
    e.preventDefault();
  }, true);

  // —— IntersectionObserver 入场
  const io=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        en.target.classList.add("in");
        const key = en.target.id==="projCarousel"?"proj" : (en.target.id==="certCarousel"?"cert":null);
        if(key) applyStaggerOnActive(key, carouselState[key].i);
        if(en.target.id==="future") triggerFutureStagger();
      }
    });
  },{threshold:0.28});
  $$(".home-card, #projCarousel, #certCarousel, #future").forEach(el=>{ if(el) io.observe(el); });

  setupAutoRotate();
}

function inViewport(el){
  if(!el) return false;
  const r=el.getBoundingClientRect();
  return r.top<window.innerHeight*0.6 && r.bottom>window.innerHeight*0.4;
}

function syncNavOnScroll(){
  const ids=["home","projects","certificates","future"];
  let active="home";
  for(const id of ids){
    const el=document.getElementById(id);
    if(!el) continue;
    const r=el.getBoundingClientRect();
    if(r.top<=window.innerHeight*0.45) active=id;
  }
  $$(".nav-tab").forEach(t=>t.setAttribute("aria-selected", String(t.dataset.target===active)));
}

/* ============================================================
   自动轮播（8s 无交互时切换）
   ============================================================ */
let autoTimer=null;
function setupAutoRotate(){
  if(autoTimer) clearInterval(autoTimer);
  let lastActivity=Date.now();
  ["wheel","keydown","click","touchstart"].forEach(ev=>window.addEventListener(ev,()=>lastActivity=Date.now(),{passive:true}));
  autoTimer=setInterval(()=>{
    if(Date.now()-lastActivity<8000) return;
    const proj=$("#projCarousel"), cert=$("#certCarousel");
    if(inViewport(proj)) nextCard("proj",1);
    else if(inViewport(cert)) nextCard("cert",1);
  },4000);
}

/* ============================================================
   LLX 视差层：滚动视差 + 鼠标轻微移动（镂空字在卡片层之下）
   ============================================================ */
function setupLlxParallax(){
  const el=$("#llxBg"); if(!el) return;
  // 减少动画偏好下不做视差
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let tx=0, ty=0, x=0, y=0;
  const move=(cx,cy)=>{
    // 鼠标轻微移动：归一化后取小幅偏移
    tx = (cx/window.innerWidth - .5) * 52;
    ty = (cy/window.innerHeight - .5) * 28;
  };
  window.addEventListener("mousemove",e=>move(e.clientX,e.clientY),{passive:true});
  window.addEventListener("touchmove",e=>{ if(e.touches[0]) move(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
  (function loop(){
    // lerp 平滑追随
    x += (tx-x)*.06;
    y += (ty-y)*.06;
    // 滚动视差：LLX 低速跟随滚动，形成前后景深
    const sy = window.scrollY * .18;
    el.style.transform = `translate3d(${x.toFixed(2)}px, ${(y+sy).toFixed(2)}px, 0)`;
    requestAnimationFrame(loop);
  })();
}
